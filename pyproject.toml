[project]
name = "iactivity-pipeline"
version = "2025.04.30"
description = "A processing pipeline that finds .cwa files in a specified input folder and processes matching sensor raw files as a sensor set generating different movement outcomes"
readme = "README.rst"
requires-python = "==3.9.13"
dependencies = [
    "agcounts>=0.2.6",
    "epoch>=0.1.5",
    "openmovement",
    "requests>=2.32.3",
    "seaborn>=0.13.2",
    "stepcount>=3.12.0",
]

[tool.uv.sources]
openmovement = { git = "https://github.com/digitalinteraction/openmovement-python" }
